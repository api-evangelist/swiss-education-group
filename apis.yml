name: Swiss Education Group
description: 'Swiss Education Group (SEG) is a Montreux-based alliance of internationally
  celebrated hospitality, business, and culinary arts schools in Switzerland, comprising
  Cesar Ritz Colleges, Culinary Arts Academy Switzerland, Swiss Hotel Management School,
  and HIM Business School. Across five campuses it educates more than 6,000 students
  from over 110 nationalities in hospitality management, culinary arts, and business.
  It was surfaced as a portfolio company of idg-capital and added to the API Evangelist
  network for enrichment. As of this pass SEG publishes no public developer portal,
  API documentation, SDKs, or machine-readable API surface; this profile is maintained
  as a company/identity record rather than an API provider.'
